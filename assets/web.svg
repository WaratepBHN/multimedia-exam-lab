<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title desc"><title id="title">HTML CSS JavaScript และ DOM</title><desc id="desc">Browser สร้าง DOM จาก HTML; JavaScript เรียก DOM API เพื่อแก้ข้อมูล ส่วน CSS กำหนดการนำเสนอ</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#7894ad"/></marker></defs><g font-family="Noto Sans Thai,sans-serif" text-anchor="middle"><rect x="2" y="2" width="596" height="256" rx="20" fill="#0d1724" stroke="#2a3a4f"/><g fill="#192b43" stroke="#46628b"><rect x="26" y="35" width="118" height="49" rx="10"/><rect x="26" y="105" width="118" height="49" rx="10"/><rect x="26" y="175" width="118" height="49" rx="10"/></g><g fill="#edf3fb" font-size="18"><text x="85" y="67">HTML</text><text x="85" y="137">CSS</text><text x="85" y="207">JavaScript</text></g><g stroke="#7894ad" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M146 60h81"/><path d="M146 130h72l28 28"/><path d="M146 200h76l26-39"/><path d="M373 129h68"/></g><rect x="233" y="67" width="141" height="120" rx="14" fill="#17372e" stroke="#4a8f73"/><text x="303" y="100" fill="#8aefc4" font-size="21">DOM</text><path d="M303 115v16m-40 0h80m-80 0v17m40-17v17m40-17v17" stroke="#8aefc4" stroke-width="2"/><g fill="#8aefc4"><circle cx="263" cy="153" r="7"/><circle cx="303" cy="153" r="7"/><circle cx="343" cy="153" r="7"/></g><rect x="451" y="86" width="123" height="83" rx="12" fill="#172c40" stroke="#46628b"/><text x="513" y="121" fill="#edf3fb" font-size="17">Browser</text><text x="513" y="147" fill="#a8b8cb" font-size="15">แสดงผล</text><text x="199" y="222" fill="#ffc18e" font-size="14">DOM API</text><text x="303" y="42" fill="#a8b8cb" font-size="14">ข้อมูลในหน่วยความจำ</text></g></svg>
