<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="animation-title animation-desc">
  <title id="animation-title">Keyframes, in-between frames และ easing</title>
  <desc id="animation-desc">เฟรมต้นและปลายกำหนดสถานะหลัก เฟรมระหว่างกลางสร้างด้วย interpolation กราฟระยะสะสมโค้งขึ้นแสดงการเร่งจากความชันที่เพิ่มขึ้น</desc>
  <defs>
    <marker id="animation-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#a8b8cb" stroke-width="1.5"/></marker>
  </defs>
  <rect width="600" height="260" rx="20" fill="#0d1724"/>
  <g font-family="Noto Sans Thai, NotoSansThai, sans-serif" text-anchor="middle">
    <path d="M87 68H511" stroke="#a8b8cb" stroke-width="2" marker-end="url(#animation-arrow)"/>
    <rect x="34" y="36" width="64" height="64" rx="14" fill="#18362f" stroke="#8aefc4" stroke-width="2"/>
    <circle cx="66" cy="68" r="17" fill="#8aefc4"/>
    <rect x="148" y="44" width="48" height="48" rx="11" fill="#152438" stroke="#9dbdff" stroke-width="1.5"/>
    <circle cx="172" cy="68" r="10" fill="#9dbdff" opacity=".5"/>
    <rect x="254" y="44" width="48" height="48" rx="11" fill="#152438" stroke="#9dbdff" stroke-width="1.5"/>
    <circle cx="278" cy="68" r="13" fill="#9dbdff" opacity=".7"/>
    <rect x="360" y="44" width="48" height="48" rx="11" fill="#152438" stroke="#9dbdff" stroke-width="1.5"/>
    <circle cx="384" cy="68" r="16" fill="#9dbdff" opacity=".9"/>
    <rect x="502" y="36" width="64" height="64" rx="14" fill="#18362f" stroke="#8aefc4" stroke-width="2"/>
    <circle cx="534" cy="68" r="22" fill="#8aefc4"/>
    <text x="66" y="126" fill="#8aefc4" font-size="17">Keyframe</text>
    <text x="278" y="126" fill="#9dbdff" font-size="17">In-between frames</text>
    <text x="534" y="126" fill="#8aefc4" font-size="17">Keyframe</text>
    <path d="M71 224V155M71 224H244" fill="none" stroke="#a8b8cb" stroke-width="1.5"/>
    <path d="M73 221Q182 221 231 159" fill="none" stroke="#ffc18e" stroke-width="4" stroke-linecap="round"/>
    <text x="49" y="162" fill="#a8b8cb" font-size="16">S(t)</text>
    <text x="259" y="230" fill="#a8b8cb" font-size="16">t</text>
    <text x="411" y="179" fill="#edf3fb" font-size="20">Ease-in</text>
    <text x="411" y="208" fill="#ffc18e" font-size="17">ความชันเพิ่ม → เร็วขึ้น</text>
    <text x="411" y="234" fill="#a8b8cb" font-size="16">S(t) = ระยะสะสม</text>
  </g>
</svg>
