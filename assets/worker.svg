<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="title desc"><title id="title">Main thread และ Web Worker</title><desc id="desc">Main thread ส่งงานให้ Worker คำนวณ จากนั้น Worker ส่งผลกลับด้วย message ให้ main thread อัปเดต DOM</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#8aefc4"/></marker></defs><g font-family="Noto Sans Thai,sans-serif"><rect x="2" y="2" width="696" height="296" rx="20" fill="#0d1724" stroke="#2a3a4f"/><rect x="24" y="25" width="275" height="247" rx="14" fill="#14263a" stroke="#46628b"/><rect x="402" y="25" width="274" height="247" rx="14" fill="#163129" stroke="#426b57"/><g text-anchor="middle"><text x="161" y="62" fill="#9dbdff" font-size="20">MAIN THREAD</text><text x="539" y="62" fill="#8aefc4" font-size="20">WEB WORKER</text><text x="161" y="111" fill="#edf3fb" font-size="17">รับ input / ตอบสนอง UI</text><text x="539" y="144" fill="#edf3fb" font-size="18">คำนวณงานหนัก</text><text x="161" y="220" fill="#edf3fb" font-size="17">แก้ DOM / อัปเดตภาพ</text><text x="539" y="220" fill="#a8b8cb" font-size="15">เข้าถึง page DOM โดยตรงไม่ได้</text></g><g stroke="#8aefc4" stroke-width="2" marker-end="url(#a)"><path d="M273 110h153"/><path d="M426 185H273"/></g><text x="350" y="96" text-anchor="middle" fill="#a8b8cb" font-size="13">ส่งงาน</text><text x="350" y="209" text-anchor="middle" fill="#a8b8cb" font-size="13">postMessage: ส่งผลกลับ</text></g></svg>
