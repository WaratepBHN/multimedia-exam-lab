<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title desc"><title id="title">Lossless กับ Lossy audio</title><desc id="desc">Lossless ทำนายและเก็บผลต่างเพื่อคืนค่าเดิม ส่วน lossy จัดบิตตามการรับรู้เสียง</desc><g font-family="Noto Sans Thai,sans-serif"><rect x="2" y="2" width="596" height="256" rx="20" fill="#0d1724" stroke="#2a3a4f"/><text x="28" y="40" fill="#ffc18e" font-size="17">LOSSLESS</text><text x="330" y="40" fill="#9dbdff" font-size="17">LOSSY</text><path d="M300 28v204" stroke="#2a3a4f"/><g fill="#edf3fb" font-size="20" text-anchor="middle"><text x="76" y="90">1000</text><text x="149" y="90">1003</text><text x="222" y="90">1001</text></g><path d="M45 113h210" stroke="#426351"/><g fill="#8aefc4" font-size="21" text-anchor="middle"><text x="76" y="151">1000</text><text x="149" y="151">+3</text><text x="222" y="151">−2</text></g><text x="150" y="200" fill="#a8b8cb" font-size="16" text-anchor="middle">ทำนาย + residual → คืนค่าเดิม</text><g stroke="#8aefc4" stroke-width="8" stroke-linecap="round"><path d="M351 125v22M377 97v50M403 63v84M429 108v39M455 118v29M481 82v65M507 107v40M533 130v17"/></g><path d="M335 151C360 151 374 121 391 116S422 124 441 142S483 150 552 151" stroke="#ffc18e" stroke-width="3" fill="none" stroke-dasharray="6 5"/><text x="445" y="199" fill="#a8b8cb" font-size="16" text-anchor="middle">masking → จัดบิต → quantize</text><text x="445" y="225" fill="#9dbdff" font-size="14" text-anchor="middle">ฟังคล้ายเดิม ≠ ตัวเลขเดิมทุกค่า</text></g></svg>
